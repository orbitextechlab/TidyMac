name: TidyMac
options:
  bundleIdPrefix: com.tidymac
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing so the project builds locally without a Developer ID.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"

targets:
  TidyMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/TidyMac
    dependencies:
      - target: smc-helper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tidymac.app
        PRODUCT_NAME: TidyMac
        INFOPLIST_FILE: Sources/TidyMac/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/TidyMac/Resources/TidyMac.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
    postBuildScripts:
      - name: Embed smc-helper
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="$BUILT_PRODUCTS_DIR/smc-helper"
          DEST="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/smc-helper"
          if [ -f "$SRC" ]; then
            cp -f "$SRC" "$DEST"
            # Re-sign with whatever identity this build is using, not a
            # hard-coded ad-hoc one: notarization requires every Mach-O in the
            # bundle to carry the Developer ID signature and a secure
            # timestamp, and signing ad-hoc here would silently throw away the
            # good signature Xcode just produced.
            IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
            if [ "$IDENTITY" = "-" ]; then
              codesign --force --options runtime --sign - "$DEST"
            else
              codesign --force --options runtime --timestamp --sign "$IDENTITY" "$DEST"
            fi
          fi

  smc-helper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/smc-helper
      - path: Sources/TidyMac/Services/SMC/SMCKit.swift
    settings:
      base:
        PRODUCT_NAME: smc-helper
        ENABLE_HARDENED_RUNTIME: "YES"
