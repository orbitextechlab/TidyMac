name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, notarize and publish
    runs-on: macos-15

    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets are present
        run: |
          missing=""
          for s in APPLE_TEAM_ID MACOS_CERT_P12 MACOS_CERT_PASSWORD \
                   APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            eval "v=\${$s}"
            [ -n "$v" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            echo "A release has to be signed and notarized; see CONTRIBUTING.md."
            exit 1
          fi
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      # A throwaway keychain keeps the signing key out of the runner's login
      # keychain and dies with the job.
      - name: Import the signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(uuidgen)

          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt that nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Store the notarization credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          xcrun notarytool store-credentials TidyMacNotary \
            --key "$RUNNER_TEMP/key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --keychain "$RUNNER_TEMP/build.keychain"
          rm -f "$RUNNER_TEMP/key.p8"

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project TidyMac.xcodeproj \
            -scheme TidyMac \
            -configuration Release \
            -derivedDataPath .derived \
            MARKETING_VERSION=${{ steps.v.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=$TEAM_ID \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            build

      - name: Check the build before submitting it to Apple
        id: stage
        run: |
          set -euo pipefail
          APP=$(find .derived -name TidyMac.app -maxdepth 5 | head -1)
          test -n "$APP" || { echo "no app bundle produced"; exit 1; }
          test -x "$APP/Contents/MacOS/smc-helper" || { echo "smc-helper not embedded"; exit 1; }

          # A release that only runs on the runner's own architecture is a
          # release half the Macs out there cannot open.
          for bin in TidyMac smc-helper; do
            archs=$(lipo -archs "$APP/Contents/MacOS/$bin")
            echo "$bin: $archs"
            case "$archs" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "$bin is not universal ($archs)"; exit 1 ;;
            esac
          done

          got=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          test "$got" = "${{ steps.v.outputs.version }}" || {
            echo "bundle version is $got, expected ${{ steps.v.outputs.version }}"; exit 1; }

          # Notarization rejects any Mach-O that is ad-hoc signed or missing the
          # hardened runtime, so catch it here where the error is readable.
          codesign --verify --strict --deep --verbose=2 "$APP"
          for bin in "$APP/Contents/MacOS/TidyMac" \
                     "$APP/Contents/MacOS/smc-helper" \
                     "$APP/Contents/Resources/smc-helper"; do
            info=$(codesign -dv --verbose=2 "$bin" 2>&1)
            echo "$info" | grep -q "adhoc" && { echo "$bin is ad-hoc signed"; exit 1; }
            echo "$info" | grep -q "flags=.*runtime" || { echo "$bin lacks hardened runtime"; exit 1; }
            echo "$info" | grep -q "Authority=Developer ID Application" || {
              echo "$bin is not signed with Developer ID"; exit 1; }
          done

          echo "app=$APP" >> "$GITHUB_OUTPUT"

      # Notarize the app itself first, then staple the ticket into the bundle,
      # so the copy inside the disk image is valid offline. Notarizing only the
      # disk image would leave the extracted app unstapled.
      - name: Notarize the app
        run: |
          set -euo pipefail
          APP="${{ steps.stage.outputs.app }}"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --keychain-profile TidyMacNotary \
            --keychain "$RUNNER_TEMP/build.keychain" \
            --wait --timeout 30m
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Stage the stapled app
        run: |
          mkdir -p dist/stage
          cp -R "${{ steps.stage.outputs.app }}" dist/stage/

      - name: Build the disk image
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          create-dmg \
            --volname "TidyMac" \
            --background "Design/DMG/dmg-background.tiff" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "TidyMac.app" 165 185 \
            --app-drop-link 495 185 \
            --hide-extension "TidyMac.app" \
            --no-internet-enable \
            "dist/TidyMac-$VERSION.dmg" \
            "dist/stage/"

      # The disk image is a separate distributable and carries its own ticket,
      # so Gatekeeper is satisfied before the user even copies the app out.
      - name: Notarize the disk image
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "dist/TidyMac-$VERSION.dmg" \
            --keychain-profile TidyMacNotary \
            --keychain "$RUNNER_TEMP/build.keychain" \
            --wait --timeout 30m
          xcrun stapler staple "dist/TidyMac-$VERSION.dmg"
          xcrun stapler validate "dist/TidyMac-$VERSION.dmg"

      # Zipped from the stapled bundle, so the zip download is offline-valid too.
      - name: Build the zip
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: ditto -c -k --keepParent "dist/stage/TidyMac.app" "dist/TidyMac-$VERSION.zip"

      - name: Verify Gatekeeper accepts the result
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          hdiutil attach "dist/TidyMac-$VERSION.dmg" -mountpoint /tmp/tidymac-dmg -nobrowse -quiet
          test -d /tmp/tidymac-dmg/TidyMac.app || { echo "app missing from dmg"; exit 1; }
          test -e /tmp/tidymac-dmg/Applications || { echo "Applications drop link missing"; exit 1; }
          xcrun stapler validate /tmp/tidymac-dmg/TidyMac.app
          # This is the check that decides whether a downloaded copy opens.
          spctl --assess --type execute --verbose=4 /tmp/tidymac-dmg/TidyMac.app
          hdiutil detach /tmp/tidymac-dmg -quiet
          echo "disk image notarized and accepted by Gatekeeper"

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 TidyMac-*.dmg TidyMac-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cat > dist/notes.md <<NOTES
          ## Install

          Download \`TidyMac-$VERSION.dmg\` below, open it, and drag **TidyMac** into
          **Applications**. It is signed and notarized by Apple, so it opens on a
          double-click with no warnings and no workarounds.

          Or in one command:

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/orbitextechlab/TidyMac/main/install.sh | bash
          \`\`\`

          ## Verifying the download

          \`\`\`bash
          shasum -a 256 -c SHA256SUMS.txt
          spctl --assess --type execute -vv /Applications/TidyMac.app
          \`\`\`

          The second command should print \`accepted\` and
          \`source=Notarized Developer ID\`.

          Builds are universal — Apple Silicon and Intel.
          NOTES
          cat dist/notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            dist/TidyMac-*.dmg \
            dist/TidyMac-*.zip \
            dist/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --title "TidyMac ${{ steps.v.outputs.version }}" \
            --notes-file dist/notes.md \
            --verify-tag

      - name: Clean up the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true
